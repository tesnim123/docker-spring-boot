version: "3.3"
services:
  mysqldb:
    container_name: mysqldb
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tpachat
    volumes:
      - mysql-data:/var/lib/mysql

  spring_app:
    build: .
    image: tesnim123/docker-spring-boot:latest
    container_name: spring_app
    restart: on-failure
    ports:
      - "8083:8083"
    depends_on:
      - mysqldb

volumes:
  mysql-data: